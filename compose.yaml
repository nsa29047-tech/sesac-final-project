# 전체 스택: 브라우저 -> web(3000) -> server(Spring, 8081) -> chatbot(FastAPI) -> db(Postgres + pgvector)
#
#   cp docker/stack.env.example docker/stack.env        # 비밀번호·키를 채운다(git 제외)
#   uv run python src/db/export_snapshot.py             # 처음 한 번: Supabase 데이터를 data/db_snapshot/ 에 내보낸다
#   docker compose --env-file docker/stack.env up -d --build
#
# 챗봇(chatbot)은 외부에 포트를 열지 않는다: 인증이 없는 서버라서 Spring(server)만 접근할 수 있게 한다.
# db 는 처음 만들 때만 초기화한다(docker/db/init/10-init.sh). 스냅샷을 바꿨으면 `docker compose down -v` 후 다시 올린다.
name: sesac

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sesac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?docker/stack.env 에 POSTGRES_PASSWORD 를 채우세요}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?docker/stack.env 에 READONLY_DB_PASSWORD 를 채우세요}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?docker/stack.env 에 APP_DB_PASSWORD 를 채우세요}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./data/db_snapshot:/snapshot:ro
      - ./src/db:/sql:ro
    ports:
      - "127.0.0.1:5434:5432"   # 호스트의 psql·DB 도구로 들여다볼 때만 쓴다(내 PC에서만 접속 가능)
    healthcheck:
      # 초기화 중의 임시 서버는 소켓으로만 듣는다. TCP 로 확인해야 초기화가 끝난 뒤에야 healthy 가 된다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sesac"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  chatbot:
    build:
      context: .
      dockerfile: docker/chatbot.Dockerfile
    environment:
      # 읽기 전용 계정만 준다(쓰기 권한이 있는 접속 문자열은 이 컨테이너에 없다)
      READONLY_POSTGRES_URI: postgresql://readonly_user:${READONLY_DB_PASSWORD}@db:5432/sesac
      OPENAI_API_KEY: ${OPENAI_API_KEY:?docker/stack.env 에 OPENAI_API_KEY 를 채우세요}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - chatbot-data:/app/data   # 지명 좌표 캐시(Places 호출 일일 한도를 아끼려고 유지한다)
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./server
    environment:
      APP_DB_URL: jdbc:postgresql://db:5432/sesac
      APP_DB_USER: app_user
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?docker/stack.env 에 JWT_SECRET 을 채우세요}
      CHAT_API_URL: http://chatbot:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      chatbot:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # 브라우저가 접속하는 주소다(컨테이너 이름이 아니라 호스트에서 보이는 주소)
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  chatbot-data:
