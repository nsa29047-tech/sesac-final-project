spring:
  application:
    name: restaurant-server
  datasource:
    # app_user 계정(src/db/migrate_app_schema.sql). 값은 환경변수로만 받는다
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${APP_DB_USER:app_user}
    password: ${APP_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 SQL 마이그레이션이 만들고, 엔티티가 테이블과 맞는지만 검사한다

app:
  jwt:
    secret: ${JWT_SECRET}   # 기본값을 두지 않는다(없으면 기동 실패). 32바이트 이상의 무작위 문자열
    expiration: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
