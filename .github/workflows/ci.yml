name: CI

# main 으로 들어가는 PR 과 main push 에서 돈다. 외부 API(OpenAI·Places·Tavily)와 Supabase 는 쓰지 않는다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (Spring, Gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # 서버 테스트는 실제 Postgres 가 필요하다(APP_DB_URL 이 있을 때만 DB 테스트가 돈다)
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-admin-password
      PGDATABASE: postgres
      # 이 실행에서만 쓰는 일회용 값이다
      APP_DB_PASSWORD: ci-app-user-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: DB 스키마 적용 (public 식당 스키마 -> app 스키마와 app_user)
        working-directory: .
        run: |
          psql -v ON_ERROR_STOP=1 -q -f src/db/restaurant_schema.sql
          sed "s/<여기에 비밀번호>/${APP_DB_PASSWORD}/g" src/db/migrate_app_schema.sql | psql -v ON_ERROR_STOP=1 -q

      - name: 테스트
        env:
          APP_DB_URL: jdbc:postgresql://localhost:5432/postgres
          APP_DB_USER: app_user
          JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 올리기 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          retention-days: 7

  web:
    name: web (Next.js, tsc / eslint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # LayoutProps 같은 전역 타입은 next dev/build/typegen 이 만든다(git 제외). tsc 전에 먼저 생성한다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  chatbot:
    name: chatbot (Python, DB 없는 단위 시험)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      # 챗봇 이미지와 같은 방식: uv.lock 으로 버전을 고정하고 챗봇이 import 하는 패키지만 설치한다
      # (pyproject 전체는 parse-apis 경로 의존성 등 때문에 CI 에서 설치하지 않는다)
      - name: 의존성 설치
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-emit-package parse-apis -o constraints.txt
          uv venv
          uv pip install -r docker/chatbot.deps.txt -c constraints.txt

      - name: 응답 변환 단위 시험 (DB 없음)
        run: uv run --no-project python src/chatbot/test_serialize.py --no-db

  docker:
    name: docker (이미지 빌드)
    runs-on: ubuntu-latest
    needs: [server, web, chatbot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: chatbot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/chatbot.Dockerfile
          push: false
          cache-from: type=gha,scope=chatbot
          cache-to: type=gha,mode=max,scope=chatbot

      - name: server
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
